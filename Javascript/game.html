<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Racing Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/game.css">
</head>
<body class="bg-dark text-white">

  <div class="container d-flex flex-column align-items-center py-4">
    <h1>🏁 Racing Game</h1>
    <div class="mb-2">
      <span id="score">Score: 0</span> |
      <span id="highscore">High Score: 0</span>
    </div>

    <div id="game-container" class="position-relative">
      <div id="car"></div>
      <div id="obstacle"></div>
      <button id="restartBtn" class="btn btn-warning position-absolute top-50 start-50 translate-middle d-none">
        Restart
      </button>
    </div>

    <p class="mt-3 text-muted">Use ← → arrows to move</p>
  </div>

  <script src="assets/game.js"></script>
</body>
</html>
